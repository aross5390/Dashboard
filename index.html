<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wise House Portal</title>
<meta name="theme-color" content="#142136">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>

  /* ===================== DESIGN TOKENS (matched to wisehousebugs.com) ===================== */
  :root {
    --green:      #2DB03D;   /* brand CTA green */
    --green-dark: #239231;
    --green-logo: #69B73C;
    --blue:       #117EC0;   /* logo blue / links */
    --blue-deep:  #185F8E;   /* hero overlay blue */
    --ink:        #163350;   /* headings / nav text */
    --slate:      #5B6B7A;
    --slate-soft: #8A98A6;
    --fog:        #F4F7F9;
    --paper:      #FFFFFF;
    --line:       #E3E9EE;
    --stamp-green:#1F8C33;

    --font-display: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --radius: 10px;
    --shadow-card: 0 1px 2px rgba(22,51,80,0.05), 0 8px 24px rgba(22,51,80,0.07);
    --shadow-lift: 0 4px 10px rgba(22,51,80,0.10), 0 20px 40px rgba(22,51,80,0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { color-scheme: light; cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNNCAyIEw0IDE4LjUgTDguMiAxNC44IEwxMC45IDIwLjQgTDEzLjUgMTkuMSBMMTAuOCAxMy41IEwxNi4yIDEzLjUgWiIgZmlsbD0iYmxhY2siIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=') 4 2, default !important; }
  body {
    background: var(--fog);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNNCAyIEw0IDE4LjUgTDguMiAxNC44IEwxMC45IDIwLjQgTDEzLjUgMTkuMSBMMTAuOCAxMy41IEwxNi4yIDEzLjUgWiIgZmlsbD0iYmxhY2siIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=') 4 2, default !important;
  }
  h1, h2, h3, h4, p, span, div, label, li, td, th {
    cursor: inherit;
  }
  input, select, textarea {
    color: var(--ink);
    caret-color: var(--ink);
    accent-color: var(--green);
    cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDE2IDI0Ij4KICA8cGF0aCBkPSJNNSAxLjUgSDExIFY0IEg5LjIgVjIwIEgxMSBWMjIuNSBINSBWMjAgSDYuOCBWNCBINSBaIiBmaWxsPSJibGFjayIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIwLjkiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+Cg==') 8 12, text !important;
  }
  select { cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNNCAyIEw0IDE4LjUgTDguMiAxNC44IEwxMC45IDIwLjQgTDEzLjUgMTkuMSBMMTAuOCAxMy41IEwxNi4yIDEzLjUgWiIgZmlsbD0iYmxhY2siIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=') 4 2, default !important; }
  input[type="checkbox"], input[type="radio"] { cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNNCAyIEw0IDE4LjUgTDguMiAxNC44IEwxMC45IDIwLjQgTDEzLjUgMTkuMSBMMTAuOCAxMy41IEwxNi4yIDEzLjUgWiIgZmlsbD0iYmxhY2siIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=') 4 2, default !important; }
  button, a, [role="button"] { cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNNCAyIEw0IDE4LjUgTDguMiAxNC44IEwxMC45IDIwLjQgTDEzLjUgMTkuMSBMMTAuOCAxMy41IEwxNi4yIDEzLjUgWiIgZmlsbD0iYmxhY2siIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMS4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=') 4 2, default !important; }
  h1, h2, h3, .display {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .mono { font-family: var(--font-mono); letter-spacing: 0.01em; }
  a { color: inherit; }
  button { font-family: var(--font-body); cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ===================== VIEW TRANSITIONS ===================== */
  ::view-transition-old(view-root),
  ::view-transition-new(view-root) {
    animation-duration: 0.38s;
    animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .view-fade-in {
    animation: viewFadeIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes viewFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===================== APP SHELL ===================== */
  #app { min-height: 100vh; }
  .hidden { display: none !important; }

  /* ===================== AUTH SHELL ===================== */
  .auth-shell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .auth-shell { grid-template-columns: 1fr; }
    .auth-visual { min-height: 220px; }
  }

  .auth-visual {
    background-image: linear-gradient(135deg, #134334 0%, #11496e 55%, #092d47 100%);
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 44px;
    position: relative;
    overflow: hidden;
  }
  .auth-visual .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .auth-visual .brand {
    background: rgba(255,255,255,0.96);
    padding: 10px 16px;
    border-radius: 9px;
    box-shadow: var(--shadow-card);
    width: fit-content;
  }
  .auth-visual .brand img {
    height: 34px;
    display: block;
  }

  .auth-visual .tagline {
    z-index: 2;
    max-width: 400px;
  }
  .auth-visual .tagline .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #A9E3AE;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: block;
  }
  .auth-visual .tagline h1 {
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.18;
    color: #fff;
    margin-bottom: 12px;
  }
  .auth-visual .tagline p {
    font-size: 14.5px;
    color: rgba(255,255,255,0.82);
    line-height: 1.6;
  }
  .auth-visual .stat {
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    padding: 14px 18px;
    width: fit-content;
    backdrop-filter: blur(2px);
  }
  .auth-visual .stat .num {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
  }
  .auth-visual .stat .num .plus { color: var(--green-logo); }
  .auth-visual .stat .label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.78);
    line-height: 1.35;
    max-width: 120px;
  }

  .route-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.55;
    z-index: 1;
    pointer-events: none;
  }
  .route-overlay .route-path {
    fill: none;
    stroke: rgba(255,255,255,0.5);
    stroke-width: 2;
    stroke-dasharray: 7 9;
  }
  .route-overlay .route-dot {
    fill: var(--green-logo);
    filter: drop-shadow(0 0 6px rgba(105,183,60,0.95));
    offset-path: path('M -20 880 C 160 680, 240 980, 400 740 S 660 480, 700 260');
    animation: routeMove 11s linear infinite;
  }
  @keyframes routeMove {
    from { offset-distance: 0%; }
    to   { offset-distance: 100%; }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .auth-visual .brand { animation: fadeSlideUp 0.55s ease-out both; }
  .auth-visual .tagline .eyebrow { animation: fadeSlideUp 0.55s ease-out 0.1s both; }
  .auth-visual .tagline h1 { animation: fadeSlideUp 0.55s ease-out 0.18s both; }
  .auth-visual .tagline p { animation: fadeSlideUp 0.55s ease-out 0.26s both; }
  .auth-visual .stat { animation: fadeSlideUp 0.55s ease-out 0.34s both; }

  /* ===================== AUTH PANEL ===================== */
  .auth-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .auth-card-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
  }
  .card-owl {
    position: absolute;
    top: -58px;
    left: 50%;
    width: 84px;
    transform: translateX(-50%);
    z-index: 3;
    filter: drop-shadow(0 8px 16px rgba(22,51,80,0.22));
    animation: owlDrop 0.6s cubic-bezier(0.2, 1.2, 0.4, 1) 0.1s both;
  }
  @keyframes owlDrop {
    from { opacity: 0; transform: translateX(-50%) translateY(-22px) scale(0.75); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  .auth-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 46px 36px 40px;
    width: 100%;
  }
  .auth-card h2 {
    font-size: 22px;
    margin-bottom: 22px;
  }
  .auth-card .sub {
    font-size: 13.5px;
    color: var(--slate);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    padding: 11px 13px;
    font-size: 14.5px;
    font-family: var(--font-body);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(17,126,192,0.14);
    outline: none;
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-display);
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { background: var(--green-dark); box-shadow: var(--shadow-lift); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed !important; transform: none; }

  .btn-primary.loading { position: relative; color: transparent; }
  .btn-primary.loading::after {
    content: '';
    position: absolute; left: 50%; top: 50%;
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .auth-links {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-size: 13px;
  }
  .auth-links button {
    background: none; border: none; padding: 0;
    color: var(--slate);
    text-decoration: underline;
    text-decoration-color: var(--line);
    font-size: 13px;
  }
  .auth-links button:hover { color: var(--ink); }

  .form-msg {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 7px;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .form-msg.error { background: rgba(197,58,58,0.08); color: #C53A3A; border: 1px solid rgba(197,58,58,0.2); }
  .form-msg.success { background: rgba(45,176,61,0.08); color: var(--green-dark); border: 1px solid rgba(45,176,61,0.25); }

  /* ===================== DASHBOARD ===================== */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    position: relative;
    z-index: 10;
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand img { height: 48px; }
  .topbar .user { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink); }
  .role-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .role-tag.role-admin, .role-pill.role-admin { background: rgba(17,126,192,0.12); color: var(--blue); }
  .role-tag.role-technician, .role-pill.role-technician { background: rgba(45,176,61,0.12); color: var(--green-dark); }
  .role-tag.role-marketing, .role-pill.role-marketing { background: rgba(232,163,61,0.15); color: #9a6a1f; }
  .role-tag.role-superadmin, .role-pill.role-superadmin { background: rgba(109,64,181,0.14); color: #6d40b5; }
  .topbar .user button {
    background: #fff; border: 1px solid var(--line);
    color: var(--ink); padding: 7px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }
  .topbar .user button:hover { background: var(--fog); border-color: var(--blue); }
  .topbar .user button:active { transform: scale(0.96); }

  /* ---- shell: sidebar + content ---- */
  .dash-shell {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 65px);
    background: var(--fog);
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dash-sidebar {
    width: 232px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    animation: slideInLeft 0.45s cubic-bezier(0.22,0.61,0.36,1) both;
  }
  .sidebar-user {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-user .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--green));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    box-shadow: 0 4px 10px rgba(22,51,80,0.18);
  }
  .sidebar-user .sname { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .role-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
  }

  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .side-tab {
    text-align: left;
    background: none;
    border: none;
    padding: 11px 14px;
    border-radius: 8px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--slate);
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
  }
  .side-tab svg { flex-shrink: 0; opacity: 0.75; }
  .side-tab.active svg { opacity: 1; }
  .side-tab.active { color: var(--ink); background: var(--fog); }
  .side-tab.active::before {
    content: '';
    position: absolute; left: 0; top: 9px; bottom: 9px;
    width: 3px; background: var(--green); border-radius: 2px;
  }
  .side-tab:not(.active):hover:not(:disabled) { background: var(--fog); color: var(--ink); padding-left: 18px; }
  .side-tab:disabled { cursor: not-allowed !important; opacity: 0.6; }
  .side-tab .soon {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--slate-soft);
    margin-top: 2px;
    font-weight: 400;
  }
  .side-nav-group-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate-soft);
    padding: 14px 14px 4px;
  }
  .side-nav-group-label:first-child { padding-top: 2px; }

  /* ---- notification bell ---- */
  .notif-wrap { position: relative; display: flex; align-items: center; }
  .notif-bell {
    position: relative;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    transition: background 0.15s ease;
  }
  .notif-bell:hover { background: var(--fog); }
  .notif-badge {
    position: absolute;
    top: 2px; right: 2px;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    border-radius: 8px;
    background: #E8503D;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 0 0 2px #fff;
  }
  .notif-panel {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 320px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-lift);
    z-index: 500;
    overflow: hidden;
    animation: fadeUp 0.2s cubic-bezier(0.22,0.61,0.36,1) both;
  }
  .notif-panel-header {
    padding: 14px 16px 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .notif-item {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--fog); }
  .notif-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--blue);
    margin-top: 5px;
    flex-shrink: 0;
  }
  .notif-item.read .notif-dot { background: transparent; }
  .notif-text { font-size: 12.5px; color: var(--ink); line-height: 1.4; }
  .notif-time {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--slate-soft);
    margin-top: 2px;
  }
  .notif-empty { padding: 24px 16px; text-align: center; font-size: 12.5px; color: var(--slate-soft); }

  /* ---- ambient sidebar route animation ---- */
  .sidebar-route {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .sidebar-route .route-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--slate-soft);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 6px;
  }
  .sidebar-route svg { display: block; width: 100%; height: auto; overflow: visible; }
  .route-map-line {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    stroke-dasharray: 4 6;
    stroke-linecap: round;
  }
  .route-map-stop {
    fill: var(--slate-soft);
    opacity: 0.45;
  }
  .route-map-home {
    fill: var(--blue);
    opacity: 0.55;
  }
  .route-map-marker {
    fill: var(--green);
    filter: drop-shadow(0 0 3px rgba(45,176,61,0.6));
    offset-path: path('M 22 10 C 62 28, 8 50, 46 72 C 84 94, 14 116, 54 138 C 94 160, 30 178, 66 190');
    offset-rotate: 0deg;
    animation: routeTravel 22s cubic-bezier(0.45,0,0.55,1) infinite alternate;
  }
  @keyframes routeTravel {
    from { offset-distance: 0%; }
    to   { offset-distance: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .route-map-marker { animation: none; offset-distance: 40%; }
  }

  .dash-content {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 42px 32px 60px;
    animation: fadeUp 0.5s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;
  }
  .dash-welcome h1 { font-size: 26px; margin-bottom: 6px; color: var(--ink); }
  .dash-welcome p { color: var(--slate); font-size: 14px; margin-bottom: 32px; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .module-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.45s cubic-bezier(0.22,0.61,0.36,1) 0.2s both;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .module-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
  }
  .module-card-link { display: block; text-decoration: none; }
  .module-card .cat {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--slate-soft);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .module-card h3 { font-size: 16px; margin-bottom: 8px; line-height: 1.3; }
  .module-card .desc { font-size: 13px; color: var(--slate); line-height: 1.5; margin-bottom: 18px; }

  .route-progress {
    display: flex; gap: 4px; margin-bottom: 14px;
  }
  .progress-status {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .progress-status.not-started { color: var(--slate-soft); }
  .progress-status.partial { color: var(--blue); }
  .progress-status.done { color: var(--green-dark); }
  .route-progress .seg {
    flex: 1; height: 5px; border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .route-progress .seg .fill {
    height: 100%; width: 0%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.22,0.61,0.36,1);
  }

  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .btn-outline {
    background: none;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-outline:hover { background: var(--blue); color: #fff; }

  /* ===================== STAMP ===================== */
  .stamp-wrap {
    position: absolute;
    top: 14px; right: 14px;
    width: 74px; height: 74px;
    pointer-events: none;
  }
  .stamp {
    width: 100%; height: 100%;
    opacity: 0;
    transform: scale(2.2) rotate(-18deg);
  }
  .stamp.stamped {
    animation: stampThump 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
  }
  @keyframes stampThump {
    0%   { opacity: 0; transform: scale(2.4) rotate(-18deg); }
    55%  { opacity: 1; transform: scale(0.92) rotate(-10deg); }
    72%  { transform: scale(1.08) rotate(-13deg); }
    100% { opacity: 1; transform: scale(1) rotate(-11deg); }
  }
  .stamp svg { width: 100%; height: 100%; }
  .stamp-ring { fill: none; stroke: var(--stamp-green); stroke-width: 3; opacity: 0.9; }
  .stamp-text {
    fill: var(--stamp-green);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
  }

  .toast-note {
    font-size: 12px;
    color: var(--slate-soft);
    margin-top: 26px;
    font-family: var(--font-mono);
  }

  /* ---- SOP library ---- */
  .sop-search {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 18px;
    transition: border-color 0.15s ease;
  }
  .sop-search:focus { outline: none; border-color: var(--blue); }
  .sop-list { display: flex; flex-direction: column; gap: 8px; }
  .sop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .sop-row:hover { box-shadow: var(--shadow-card); border-color: var(--blue); }
  .sop-row-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(17,126,192,0.1);
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sop-row-body { flex: 1; min-width: 0; }
  .sop-row-title { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .sop-row-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--slate-soft); margin-top: 2px; }
  .sop-row-chev { color: var(--slate-soft); flex-shrink: 0; }
  .sop-row-delete {
    background: none;
    border: none;
    color: var(--slate-soft);
    font-size: 15px;
    line-height: 1;
    padding: 6px;
    border-radius: 6px;
    flex-shrink: 0;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .sop-row-delete:hover { color: #B5442E; background: rgba(181,68,46,0.08); }
  .sop-empty { padding: 30px; text-align: center; color: var(--slate-soft); font-size: 13px; }

  /* ---- SOP file upload ---- */
  .sop-upload-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sop-upload-btn { display: inline-flex; padding: 9px 16px; }
  #sopFileInput, #announceFileInput, #trainFileInput { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
  .sop-upload-hint { font-size: 12.5px; color: var(--slate-soft); font-family: var(--font-mono); }
  .sop-upload-hint.error { color: #B5442E; }
  .sop-pending-files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sop-file-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    background: var(--fog);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--ink);
    text-decoration: none;
    max-width: 100%;
  }
  a.sop-file-chip { background: rgba(17,126,192,0.06); border-color: rgba(17,126,192,0.25); cursor: pointer; }
  a.sop-file-chip:hover { background: rgba(17,126,192,0.12); }
  .sop-file-ext {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--blue);
    background: rgba(17,126,192,0.12);
    padding: 2px 5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .sop-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .sop-file-size { color: var(--slate-soft); font-family: var(--font-mono); font-size: 10.5px; flex-shrink: 0; }
  .sop-file-remove {
    background: none;
    border: none;
    color: var(--slate-soft);
    font-size: 12px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .sop-file-remove:hover { color: #B5442E; }
  .sop-row-files { margin-top: 8px; }

  /* ---- rankings / leaderboard ---- */
  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .rank-row.me { border-color: var(--green); background: rgba(45,176,61,0.05); }
  .rank-badge {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--slate);
    background: var(--fog);
    flex-shrink: 0;
  }
  .rank-badge.gold   { background: linear-gradient(135deg, #F5D584, #D9A62B); color: #6b4d0a; }
  .rank-badge.silver { background: linear-gradient(135deg, #E7EBEE, #B9C2CA); color: #4a5560; }
  .rank-badge.bronze { background: linear-gradient(135deg, #E3B08A, #B5713C); color: #4a2f13; }
  .rank-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--green));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .rank-body { flex: 1; min-width: 0; }
  .rank-name { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .rank-stats { font-family: var(--font-mono); font-size: 10.5px; color: var(--slate-soft); margin-top: 2px; }
  .rank-score { text-align: right; flex-shrink: 0; }
  .rank-score-num { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); }
  .rank-score-label { font-family: var(--font-mono); font-size: 9px; color: var(--slate-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .rank-me-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(45,176,61,0.08), rgba(17,126,192,0.06));
    border: 1px solid rgba(45,176,61,0.25);
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .rank-me-banner-title { font-family: var(--font-mono); font-size: 10px; color: var(--slate-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .rank-me-banner-value { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink); margin-top: 2px; }
  .rank-me-banner-trend { font-family: var(--font-mono); font-size: 12px; color: var(--green-dark); font-weight: 600; }

  /* ---- sales tracking ---- */
  .sales-filter-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 14px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 18px;
  }
  .sales-filter-field { flex: 1; }
  .sales-filter-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-soft);
    margin-bottom: 6px;
  }
  .sales-filter-field input {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
  }
  .sales-filter-row .btn-outline { flex-shrink: 0; padding: 9px 16px; white-space: nowrap; }

  .sales-tech-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tech-chip {
    padding: 6px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--slate);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .tech-chip:hover { border-color: var(--blue); }
  .tech-chip.active {
    border-color: var(--green);
    background: rgba(45,176,61,0.08);
    color: var(--ink);
    font-weight: 600;
  }
  .tech-chip.chip-all { border-style: dashed; }
  .tech-chip.chip-all.active { border-style: solid; border-color: var(--blue); background: rgba(17,126,192,0.08); }

  /* ---- announcements ---- */
  .announce-form {
    padding: 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 22px;
  }
  .announce-form textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
    resize: vertical;
  }

  /* ---- rich text toolbar ---- */
  .rte-toolbar {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 6px;
    border: 1.5px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: var(--fog);
    position: relative;
  }
  .rte-btn {
    width: 30px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    transition: background 0.12s ease, color 0.12s ease;
  }
  .rte-btn:hover { background: rgba(17,126,192,0.1); }
  .rte-btn.active { background: rgba(45,176,61,0.16); color: var(--green-dark); }
  .rte-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .rte-editor {
    width: 100%;
    min-height: 84px;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 0 0 8px 8px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.5;
    overflow-y: auto;
  }
  .rte-editor:focus { outline: none; border-color: var(--blue); }
  .rte-editor:empty:before {
    content: attr(data-placeholder);
    color: var(--slate-soft);
  }
  .emoji-popover {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 40px;
    width: 220px;
    padding: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-lift);
    z-index: 20;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }
  .emoji-popover.show { display: grid; }
  .emoji-opt {
    background: none;
    border: none;
    font-size: 17px;
    padding: 5px;
    border-radius: 6px;
    line-height: 1;
  }
  .emoji-opt:hover { background: var(--fog); }
  #announceFileInput { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

  .announce-list { display: flex; flex-direction: column; gap: 10px; }
  .announce-item {
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .announce-item-title { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; color: var(--ink); margin-bottom: 4px; }
  .announce-item-body { font-size: 13px; color: var(--slate); line-height: 1.5; margin-bottom: 8px; }
  .announce-item-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--slate-soft); }

  /* ---- staff permissions ---- */
  .perm-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .perm-table th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-soft);
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--fog);
  }
  .perm-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink);
    vertical-align: middle;
  }
  .perm-table tr:last-child td { border-bottom: none; }
  .perm-name { font-family: var(--font-display); font-weight: 600; }
  .perm-table select {
    padding: 6px 8px;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    font-size: 12.5px;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .perm-table input[type="checkbox"] { width: 16px; height: 16px; }
  .perm-save-row { margin-top: 18px; display: flex; align-items: center; gap: 14px; }
  .perm-save-success {
    display: none;
    color: var(--green-dark);
    font-size: 12.5px;
    font-family: var(--font-mono);
  }
  .perm-save-success.show { display: inline-flex; align-items: center; gap: 6px; }

  .sales-stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .sales-stat-card {
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .sales-stat-label { font-family: var(--font-mono); font-size: 9.5px; color: var(--slate-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .sales-stat-value { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink); margin-top: 4px; }
  .sales-stat-delta { font-family: var(--font-mono); font-size: 11.5px; margin-top: 3px; }
  .sales-stat-delta.up { color: var(--green-dark); }
  .sales-stat-delta.down { color: #B5442E; }
  .sales-bar-list { display: flex; flex-direction: column; gap: 12px; }
  .sales-bar-row { display: flex; align-items: center; gap: 12px; }
  .sales-bar-name { width: 110px; flex-shrink: 0; font-size: 12.5px; color: var(--ink); font-weight: 600; }
  .sales-bar-track { flex: 1; height: 10px; background: var(--fog); border-radius: 6px; overflow: hidden; }
  .sales-bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); border-radius: 6px; }
  .sales-bar-value { width: 130px; text-align: right; flex-shrink: 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--slate); }
  .sales-bar-value .count { color: var(--slate-soft); }

  /* ---- report builder ---- */
  .report-builder {
    padding: 22px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .report-field { margin-bottom: 16px; }
  .report-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-soft);
    margin-bottom: 6px;
  }
  .report-field select, .report-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--ink);
  }
  .report-field-row { display: flex; gap: 12px; }
  .report-field-row .report-field { flex: 1; }
  .report-success {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    margin-top: 16px;
    background: rgba(45,176,61,0.08);
    border: 1px solid rgba(45,176,61,0.3);
    border-radius: 8px;
    color: var(--green-dark);
    font-size: 12.5px;
  }
  .report-success.show { display: flex; }
  .report-recent { margin-top: 24px; }

/* ===================== API HELPER (DEMO MODE) =====================
   This demo copy fakes the backend so you can click through without deploying

var DEMO_TEMP_PASSWORD = 'ChangeMe2026!';

/* Per-account password state, persisted so the "must change password" flow
   behaves realistically across reloads in demo mode. Seeded once with the
   shared temp password + mustChange:true for everyone; changing a password
   updates this store and clears the flag for that account. */
var DEMO_CREDS_KEY = 'wh_demo_credentials';
function seedDemoCredentials() {
  var store = null;
  try { store = JSON.parse(localStorage.getItem(DEMO_CREDS_KEY) || 'null'); } catch (e) {}
  if (!store) store = {};
  var changed = false;
  DEMO_ACCOUNTS.forEach(function (a) {
    if (!store[a.email]) {
      store[a.email] = { password: DEMO_TEMP_PASSWORD, mustChange: true };
      changed = true;
    }
  });
  if (changed) { try { localStorage.setItem(DEMO_CREDS_KEY, JSON.stringify(store)); } catch (e) {} }
  return store;
}
function getDemoCreds() {
  var store = null;
  try { store = JSON.parse(localStorage.getItem(DEMO_CREDS_KEY) || 'null'); } catch (e) {}
  return store || seedDemoCredentials();
}
seedDemoCredentials();

function apiCall(action, payload) {
  payload = payload || {};
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (action === 'login') {
        if (!payload.email || !payload.password) {
          resolve({ success: false, error: 'Email and password required.' });
          return;
        }
        var emailKey = payload.email.trim().toLowerCase();
        var match = DEMO_ACCOUNTS.filter(function (a) { return a.email.toLowerCase() === emailKey; })[0];
        var creds = getDemoCreds();
        var cred = match ? creds[match.email] : null;
        if (!match || !cred || payload.password !== cred.password) {
          resolve({ success: false, error: 'Invalid email or password.' });
          return;
        }
        resolve({
          success: true,
          sessionToken: 'demo-session-token',
          mustChangePassword: !!cred.mustChange,
          user: { employeeId: match.email, email: match.email, firstName: match.firstName, lastName: match.lastName, role: match.role }
        });
      } else if (action === 'changePassword') {
        var pw = payload.newPassword || '';
        if (!payload.email) {
          resolve({ success: false, error: 'Session expired. Please log in again.' });
          return;
        }
        if (pw.length < 8) {
          resolve({ success: false, error: 'Password must be at least 8 characters.' });
          return;
        }
        var store = getDemoCreds();
        store[payload.email] = { password: pw, mustChange: false };
        try { localStorage.setItem(DEMO_CREDS_KEY, JSON.stringify(store)); } catch (e) {}
        resolve({ success: true });
      } else if (action === 'forgotPassword') {
        resolve({ success: true, message: 'If that email exists, a reset link has been sent.' });
      } else if (action === 'resetPassword') {
        resolve({ success: true, message: 'Password updated. You can now log in.' });
      } else if (action === 'validateSession') {
        resolve({ success: false, error: 'Demo mode - no persisted session.' });
      } else if (action === 'logout') {
        resolve({ success: true });
      } else {
        resolve({ success: false, error: 'Unknown action' });
      }
    }, 500); // simulated network delay
  });
}

/* ===================== ROUTER ===================== */
function navigate(view, opts) {
  var render = function () {
    document.getElementById('app').innerHTML = '';
    if (view === 'login') renderLogin();
    else if (view === 'forgot') renderForgot();
    else if (view === 'reset') renderReset(opts);
    else if (view === 'changePassword') renderChangePassword();
    else if (view === 'dashboard') renderDashboard();
    var root = document.getElementById('app').firstElementChild;
    if (root) root.classList.add('view-fade-in');
    if (view === 'login' || view === 'forgot' || view === 'reset' || view === 'changePassword') {
      setTimeout(animateStatCounter, 150);
    }
  };
  if (document.startViewTransition) {
    document.startViewTransition(render);
  } else {
    render();
  }
}

/* ===================== BOOT ===================== */
window.addEventListener('DOMContentLoaded', function () {
  var hash = window.location.hash;
  if (hash.indexOf('#reset') === 0) {
    var params = new URLSearchParams(hash.split('?')[1] || '');
    navigate('reset', { token: params.get('token'), email: params.get('email') });
    return;
  }
  if (STATE.sessionToken) {
    // Demo mode: restore the session from localStorage instead of round-tripping
    // through the mocked validateSession (which always fails by design, since
    // there's no real backend yet). This is what keeps you logged in across a
    // page reload or browser Back/Forward instead of getting bounced to login.
    // A real backend should still validate the token server-side here.
    var cachedUser = null;
    try { cachedUser = JSON.parse(localStorage.getItem('wh_user') || 'null'); } catch (e) {}
    if (cachedUser) {
      STATE.user = cachedUser;
      var creds = getDemoCreds();
      var cred = cachedUser.email ? creds[cachedUser.email] : null;
      if (cred && cred.mustChange) {
        navigate('changePassword');
      } else {
        navigate('dashboard');
      }
    } else {
      localStorage.removeItem('wh_session');
      navigate('login');
    }
  } else {
    navigate('login');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
});

function animateStatCounter() {
  var el = document.getElementById('statNum');
  if (!el) return;
  var target = 1798;
  var duration = 1400;
  var start = null;
  function step(ts) {
    if (!start) start = ts;
    var progress = Math.min((ts - start) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = Math.floor(eased * target);
    if (progress < 1) {
      el.textContent = current.toLocaleString();
      requestAnimationFrame(step);
    } else {
      el.innerHTML = target.toLocaleString() + '<span class="plus">+</span>';
    }
  }
  requestAnimationFrame(step);
}

/* ===================== VIEW: LOGIN ===================== */
function renderLogin() {
  document.getElementById('app').innerHTML = authVisualHTML(
    'Employee Portal',
    'Everything you need for the route ahead.',
    'Training modules, leave requests, and team tools for Wise House field and office staff across South Florida.'
  );
  document.getElementById('authCard').innerHTML =
    '<h2>Sign in</h2>' +
    '<div id="loginMsg"></div>' +
    '<form id="loginForm">' +
      '<div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required /></div>' +
      '<div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required /></div>' +
      '<button class="btn-primary" type="submit" id="loginBtn">Sign in</button>' +
    '</form>' +
    '<div class="auth-links"><button id="toForgot">Forgot password?</button><span></span></div>';

  document.getElementById('toForgot').onclick = function () { navigate('forgot'); };

  document.getElementById('loginForm').onsubmit = function (e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn = document.getElementById('loginBtn');
    var msg = document.getElementById('loginMsg');
    msg.innerHTML = '';
    btn.classList.add('loading'); btn.disabled = true;

    apiCall('login', { email: email, password: password }).then(function (res) {
      btn.classList.remove('loading'); btn.disabled = false;
      if (res.success) {
        STATE.sessionToken = res.sessionToken;
        STATE.user = res.user;
        localStorage.setItem('wh_session', res.sessionToken);
        localStorage.setItem('wh_user', JSON.stringify(res.user));
        if (res.mustChangePassword) {
          navigate('changePassword');
        } else {
          navigate('dashboard');
        }
      } else {
        msg.innerHTML = '<div class="form-msg error">' + (res.error || 'Something went wrong.') + '</div>';
      }
    }).catch(function () {
      btn.classList.remove('loading'); btn.disabled = false;
      msg.innerHTML = '<div class="form-msg error">Can\'t reach the server. Check your connection and try again.</div>';
    });
  };
}

      btn.classList.remove('loading'); btn.disabled = false;
      msg.innerHTML = '<div class="form-msg error">Can\'t reach the server. Check your connection and try again.</div>';
    });
  };
}

function switchTab(tabId, navIds, TAB_META) {
  navIds.forEach(function (id) {
    var btn = document.getElementById('tab-' + id);
    if (btn) btn.classList.toggle('active', id === tabId);
  });
  var meta = TAB_META[tabId];
  document.getElementById('dashTitle').textContent = meta.label;
  document.getElementById('dashSubtitle').textContent = meta.subtitle;
  var panel = document.getElementById('mainPanel');
  panel.innerHTML = '';
  panel.className = '';
  void panel.offsetWidth;
  panel.style.animation = 'fadeUp 0.35s cubic-bezier(0.22,0.61,0.36,1) both';

  if (tabId === 'announcements') renderAnnouncementsPanel(panel);
  else if (tabId === 'training') renderTrainingPanel(panel);
  else if (tabId === 'sops') renderSOPsPanel(panel);
  else if (tabId === 'myrank') renderRankPanel(panel, true);
  else if (tabId === 'rankings') renderRankPanel(panel, false);
  else if (tabId === 'sales') renderSalesPanel(panel);
  else if (tabId === 'reports') renderReportsPanel(panel);
  else if (tabId === 'postannounce') renderPostAnnouncePanel(panel);
  else if (tabId === 'addsop') renderAddSopPanel(panel);
  else if (tabId === 'addtraining') renderAddTrainingPanel(panel);
  else if (tabId === 'permissions') renderPermissionsPanel(panel);
}

var CURRENT_NOTIF_LIST = null;

function addLiveNotification(text) {
  if (!CURRENT_NOTIF_LIST) return;
  CURRENT_NOTIF_LIST.unshift({ text: text, time: 'Just now', read: false });
  var wrap = document.getElementById('notifItems');
  if (wrap) renderNotifItems(CURRENT_NOTIF_LIST);
  var unread = CURRENT_NOTIF_LIST.filter(function (n) { return !n.read; }).length;
  var bell = document.getElementById('notifBell');
  var badge = document.getElementById('notifBadge');
  if (!badge && bell && unread > 0) {
    badge = document.createElement('span');
    badge.className = 'notif-badge';
    badge.id = 'notifBadge';
    bell.appendChild(badge);
  }
  if (badge) badge.textContent = unread;
}

function renderNotifItems(list) {
  var wrap = document.getElementById('notifItems');
  if (!list.length) {
    wrap.innerHTML = '<div class="notif-empty">You\'re all caught up.</div>';
    return;
  }
  wrap.innerHTML = list.map(function (n, i) {
    return '<div class="notif-item' + (n.read ? ' read' : '') + '" data-i="' + i + '">' +
      '<div class="notif-dot"></div>' +
      '<div><div class="notif-text">' + n.text + '</div><span class="notif-time">' + n.time + '</span></div>' +
    '</div>';
  }).join('');
  wrap.querySelectorAll('.notif-item').forEach(function (el) {
    el.onclick = function () {
      var i = parseInt(el.getAttribute('data-i'), 10);
      list[i].read = true;
      el.classList.add('read');
      var unread = list.filter(function (n) { return !n.read; }).length;
      var badge = document.getElementById('notifBadge');
      if (badge) {
        if (unread > 0) badge.textContent = unread;
        else badge.remove();
      }
    };
  });
}

function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function sampleStepsDone(techName, moduleTitle, totalSteps) {
  return hashStr(techName + '::' + moduleTitle) % (totalSteps + 1);
}

function renderTeamTrainingProgress() {
  if (!TRAINING_MODULES.length) return '';
  var rows = TRAINING_TECHS.map(function (name) {
    var completedModules = 0;
    var pctSum = 0;
    TRAINING_MODULES.forEach(function (m) {
      var steps = m.steps || 4;
      var done = sampleStepsDone(name, m.title, steps);
      pctSum += done / steps;
      if (done >= steps) completedModules++;
    });
    var avgPct = Math.round((pctSum / TRAINING_MODULES.length) * 100);
    return { name: name, avgPct: avgPct, completedModules: completedModules, total: TRAINING_MODULES.length };
  });

  return '<div class="report-recent" style="margin-top:28px;">' +
    '<div class="report-recent-title">Team Training Progress</div>' +
    '<div class="sales-bar-list">' +
      rows.map(function (r) {

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fileExtBadge(name) {
  var ext = (name.split('.').pop() || '').toUpperCase().slice(0, 4);
  return ext || 'FILE';
}

function sopFilesHtml(s) {
  if (!s.files || !s.files.length) return '';
  return '<div class="sop-row-files">' + s.files.map(function (f) {
    return '<a class="sop-file-chip" href="' + f.url + '" target="_blank" rel="noopener" download="' + f.name + '">' +
      '<span class="sop-file-ext">' + fileExtBadge(f.name) + '</span>' +
      '<span class="sop-file-name">' + f.name + '</span>' +
    '</a>';
  }).join('') + '</div>';
}

  function drawPendingFiles() {
    var hint = document.getElementById('sopFileHint');
    hint.textContent = pendingFiles.length ? pendingFiles.length + ' file(s) ready to add' : 'No files selected';
    document.getElementById('sopPendingFiles').innerHTML = pendingFiles.map(function (f, i) {
      return '<div class="sop-file-chip pending">' +
        '<span class="sop-file-ext">' + fileExtBadge(f.name) + '</span>' +
        '<span class="sop-file-name">' + f.name + '</span>' +
        '<span class="sop-file-size">' + formatFileSize(f.size) + '</span>' +
        '<button type="button" class="sop-file-remove" data-i="' + i + '" title="Remove">\u2715</button>' +
      '</div>';
    }).join('');
    document.querySelectorAll('.sop-file-remove').forEach(function (btn) {
      btn.onclick = function () {
        pendingFiles.splice(parseInt(btn.getAttribute('data-i'), 10), 1);
        drawPendingFiles();
      };
    });
  }

  document.getElementById('sopFileInput').onchange = function (e) {
    pendingFiles = pendingFiles.concat(Array.prototype.slice.call(e.target.files));
    drawPendingFiles();
    e.target.value = '';
  };

  function drawManageList() {
    document.getElementById('sopManageList').innerHTML = SOP_SECTIONS.map(function (s, i) {
      return '<div class="sop-row">' +
        '<div class="sop-row-icon">' + navIcon('sops') + '</div>' +
        '<div class="sop-row-body">' +
          '<div class="sop-row-title">' + s.title + '</div>' +
          '<div class="sop-row-meta">' + s.count + ' documents \u00b7 updated ' + s.updated + '</div>' +
          sopFilesHtml(s) +
        '</div>' +
        '<button type="button" class="sop-row-delete" data-i="' + i + '" title="Remove section">\u2715</button>' +
      '</div>';
    }).join('');

    document.querySelectorAll('.sop-row-delete').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var i = parseInt(btn.getAttribute('data-i'), 10);
        SOP_SECTIONS.splice(i, 1);
        drawManageList();
      };
    });
  }
  drawManageList();

  document.getElementById('addSopBtn').onclick = function () {
    var title = document.getElementById('sopNewTitle').value.trim();
    var hint = document.getElementById('sopFileHint');
    if (!title) return;
    if (!pendingFiles.length) {
      hint.textContent = 'Please choose at least one file.';
      hint.classList.add('error');
      return;
    }
    hint.classList.remove('error');

    var uploaded = pendingFiles.map(function (f) {
      return { name: f.name, url: URL.createObjectURL(f), size: f.size, type: f.type };
    });

    var existing = SOP_SECTIONS.filter(function (s) { return s.title.toLowerCase() === title.toLowerCase(); })[0];
    if (existing) {
      existing.files = (existing.files || []).concat(uploaded);
      existing.count = existing.files.length;
      existing.updated = 'Just now';
    } else {
      SOP_SECTIONS.unshift({ title: title, count: uploaded.length, updated: 'Just now', files: uploaded });
    }

    document.getElementById('sopNewTitle').value = '';
    pendingFiles = [];
    drawPendingFiles();
    drawManageList();
    addLiveNotification('New SOP added: <b>' + title + '</b>');

    var successBox = document.getElementById('addSopSuccess');
    document.getElementById('addSopSuccessText').textContent = existing ?
      'Added ' + uploaded.length + ' file(s) to "' + title + '".' :
      'Published new SOP section: ' + title + ' (' + uploaded.length + ' file(s)).';
    successBox.classList.add('show');
    setTimeout(function () { successBox.classList.remove('show'); }, 3500);
  };
}

var SALES_RANGE_DEFAULT_START = '2026-08-01';
var SALES_RANGE_DEFAULT_END = '2026-08-16';
var SALES_RANGE_BASE_DAYS = daysBetween(SALES_RANGE_DEFAULT_START, SALES_RANGE_DEFAULT_END);

function daysBetween(startStr, endStr) {
  var start = new Date(startStr + 'T00:00:00');
  var end = new Date(endStr + 'T00:00:00');
  var diff = Math.round((end - start) / 86400000) + 1;
  return Math.max(diff, 1);
}

function renderSalesPanel(panel) {
  var activeTechs = new Set(RANK_DATA.map(function (r) { return r.name; }));
  var appliedScale = 1;
  var appliedRangeLabel = 'Aug 1 \u2013 Aug 16 (default)';

  panel.innerHTML =
    '<div class="sales-filter-row">' +
      '<div class="sales-filter-field"><label>Start Date</label><input type="date" id="salesRangeStart" value="' + SALES_RANGE_DEFAULT_START + '" /></div>' +
      '<div class="sales-filter-field"><label>End Date</label><input type="date" id="salesRangeEnd" value="' + SALES_RANGE_DEFAULT_END + '" /></div>' +
      '<button class="btn-outline" id="applySalesRangeBtn" type="button">Apply Range</button>' +
    '</div>' +
    '<div class="sales-tech-filter" id="salesTechFilter"></div>' +
    '<div id="salesStatsWrap"></div>' +
    '<div class="toast-note" id="salesToastNote"></div>';

  function drawChips() {
    var allActive = activeTechs.size === RANK_DATA.length;
    var chips = '<button type="button" class="tech-chip chip-all' + (allActive ? ' active' : '') + '" data-chip="all">All Technicians</button>' +
      RANK_DATA.map(function (r) {
        return '<button type="button" class="tech-chip' + (activeTechs.has(r.name) ? ' active' : '') + '" data-chip="' + r.name + '">' + r.name + '</button>';
      }).join('');
    document.getElementById('salesTechFilter').innerHTML = chips;

    document.querySelectorAll('#salesTechFilter .tech-chip').forEach(function (chip) {
      chip.onclick = function () {
        var name = chip.getAttribute('data-chip');
        if (name === 'all') {
          activeTechs = new Set(RANK_DATA.map(function (r) { return r.name; }));
        } else if (activeTechs.has(name)) {
          activeTechs.delete(name);
        } else {
          activeTechs.add(name);
        }
        drawChips();
        draw(appliedScale, appliedRangeLabel);
      };
    });
  }

  function draw(scale, rangeLabel) {
    appliedScale = scale;
    appliedRangeLabel = rangeLabel;

    var filtered = RANK_DATA.filter(function (r) { return activeTechs.has(r.name); });

    if (!filtered.length) {
      document.getElementById('salesStatsWrap').innerHTML = '<div class="sop-empty">No technicians selected.</div>';
      document.getElementById('salesToastNote').textContent = 'Select at least one technician above to see data.';
      return;
    }

    var data = filtered.map(function (r) {
      return {
        name: r.name,
        me: r.me,
        sales: Math.round(r.sales * scale),
        salesCount: Math.max(1, Math.round(r.salesCount * scale))
      };
    });
    var totalSales = data.reduce(function (s, r) { return s + r.sales; }, 0);
    var totalCount = data.reduce(function (s, r) { return s + r.salesCount; }, 0);
    var avgTicket = totalCount > 0 ? Math.round(totalSales / totalCount) : 0;
    var top = data.slice().sort(function (a, b) { return b.sales - a.sales; })[0];
    var maxSales = Math.max.apply(null, data.map(function (r) { return r.sales; }));

    document.getElementById('salesStatsWrap').innerHTML =
      '<div class="sales-stat-row">' +
        '<div class="sales-stat-card">' +
          '<div class="sales-stat-label">Total Sales</div>' +
          '<div class="sales-stat-value">$' + totalSales.toLocaleString() + '</div>' +
          '<div class="sales-stat-delta up">\u2191 12% vs prior period</div>' +
        '</div>' +
        '<div class="sales-stat-card">' +
          '<div class="sales-stat-label">Number of Sales</div>' +
          '<div class="sales-stat-value">' + totalCount.toLocaleString() + '</div>' +
          '<div class="sales-stat-delta up">\u2191 8% vs prior period</div>' +
        '</div>' +
        '<div class="sales-stat-card">' +
          '<div class="sales-stat-label">Avg Ticket</div>' +
          '<div class="sales-stat-value">$' + avgTicket.toLocaleString() + '</div>' +
          '<div class="sales-stat-delta up">\u2191 4% vs prior period</div>' +
        '</div>' +
        '<div class="sales-stat-card">' +
          '<div class="sales-stat-label">Top Performer</div>' +
          '<div class="sales-stat-value" style="font-size:17px;">' + top.name + '</div>' +
          '<div class="sales-stat-delta">$' + top.sales.toLocaleString() + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sales-bar-list">' +
        data.map(function (r) {
          var pct = maxSales > 0 ? Math.round((r.sales / maxSales) * 100) : 0;
          return '<div class="sales-bar-row">' +
            '<div class="sales-bar-name">' + r.name + '</div>' +
            '<div class="sales-bar-track"><div class="sales-bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="sales-bar-value">$' + r.sales.toLocaleString() + ' <span class="count">\u00b7 ' + r.salesCount + ' sales</span></div>' +
          '</div>';
        }).join('') +
      '</div>';

    document.getElementById('salesToastNote').textContent =
      'Sample data \u2014 phase 2 mirrors your existing Employee Sales Tracking dashboard here. Showing ' + rangeLabel + '.';
  }

  drawChips();
  draw(1, 'Aug 1 \u2013 Aug 16 (default)');

  document.getElementById('applySalesRangeBtn').onclick = function () {
    var startStr = document.getElementById('salesRangeStart').value;
    var endStr = document.getElementById('salesRangeEnd').value;
    if (!startStr || !endStr || endStr < startStr) {
      document.getElementById('salesToastNote').textContent = 'Pick a valid start and end date.';
      return;
    }
    var days = daysBetween(startStr, endStr);
    var scale = days / SALES_RANGE_BASE_DAYS;
    draw(scale, startStr + ' \u2013 ' + endStr);
  };
}

function readExternalQuizProgress(key) {
  if (!key) return null;
  try {
    var saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (!saved) return null;
    return saved;
  } catch (e) { return null; }
}

function renderTrainingCards() {
  var grid = document.getElementById('cardsGrid');
  grid.innerHTML = TRAINING_MODULES.map(function (m, i) {
    if (m.launchFile) {
      var saved = readExternalQuizProgress(m.progressKey);
      var statusClass = 'not-started';
      var statusLabel = m.badge;
      if (saved) {
        if (saved.submitted) {
          statusClass = 'done';
          statusLabel = 'Completed \u00b7 Score ' + saved.score + '/' + saved.total + ' (' + saved.pct + '%)';
        } else if (saved.answeredCount > 0 || (saved.watchedIdx && saved.watchedIdx.length > 0)) {
          statusClass = 'partial';
          statusLabel = 'In progress \u00b7 ' + saved.answeredCount + ' of ' + saved.total + ' answered';
        }
      }
      return '<a class="module-card module-card-link" data-i="' + i + '" href="' + m.launchFile + '">' +
        '<div class="cat">' + m.category + '</div>' +
        '<h3>' + m.title + '</h3>' +
        '<div class="desc">' + m.desc + '</div>' +
        '<div class="progress-status ' + statusClass + '">' + statusLabel + '</div>' +
        '<div class="card-footer">' +
          '<span class="btn-outline">' + (saved && saved.submitted ? 'Review Training \u2192' : (saved ? 'Continue Training \u2192' : 'Launch Training \u2192')) + '</span>' +
        '</div>' +
      '</a>';
    }
    var steps = m.steps || 4;
    var done = TRAINING_PROGRESS[m.title] || 0;
    var pct = Math.round((done / steps) * 100);
    var segs = '';
    for (var s = 0; s < steps; s++) {
      segs += '<div class="seg"><div class="fill" style="width:' + (s < done ? '100' : '0') + '%"></div></div>';
    }
    var complete = done >= steps;
    var btnLabel = complete ? 'Completed' : (done === 0 ? 'Start Module' : 'Continue (' + done + '/' + steps + ')');
    var statusLabel = complete ? 'Completed' : (done === 0 ? 'Not started' : 'In progress \u00b7 ' + pct + '%');
    return '<div class="module-card" data-i="' + i + '">' +
      '<div class="stamp-wrap"><div class="stamp' + (complete ? ' stamped' : '') + '">' + stampSVG('PASSED') + '</div></div>' +
      '<div class="cat">' + m.category + '</div>' +
      '<h3>' + m.title + '</h3>' +
      '<div class="desc">' + m.desc + '</div>' +
      (m.files && m.files.length ? sopFilesHtml(m) : '') +
      '<div class="progress-status ' + (complete ? 'done' : (done === 0 ? 'not-started' : 'partial')) + '">' + statusLabel + '</div>' +
      '<div class="route-progress">' + segs + '</div>' +
      '<div class="card-footer"><button class="btn-outline" type="button"' + (complete ? ' disabled' : '') + '>' + btnLabel + '</button></div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('.module-card').forEach(function (card) {
    var i = parseInt(card.getAttribute('data-i'), 10);
    var m = TRAINING_MODULES[i];
    if (m.launchFile) return;
    var btn = card.querySelector('.card-footer button');
    if (btn.disabled) return;
    btn.onclick = function () {
      var steps = m.steps || 4;
      var done = (TRAINING_PROGRESS[m.title] || 0) + 1;
      TRAINING_PROGRESS[m.title] = done;
      var fills = card.querySelectorAll('.route-progress .fill');
      fills[done - 1].style.width = '100%';
      var statusEl = card.querySelector('.progress-status');
      var pct = Math.round((done / steps) * 100);
      if (done >= steps) {
        setTimeout(function () { card.querySelector('.stamp').classList.add('stamped'); }, 250);
        btn.disabled = true;
        btn.textContent = 'Completed';
        statusEl.textContent = 'Completed';
        statusEl.className = 'progress-status done';
      } else {
        btn.textContent = 'Continue (' + done + '/' + steps + ')';
        statusEl.textContent = 'In progress \u00b7 ' + pct + '%';
        statusEl.className = 'progress-status partial';
      }
    };
  });
}

    var hint = document.getElementById('trainFileHint');
    hint.textContent = pendingFiles.length ? pendingFiles.length + ' file(s) ready to add' : 'No files selected';
    document.getElementById('trainPendingFiles').innerHTML = pendingFiles.map(function (f, i) {
      return '<div class="sop-file-chip pending">' +
        '<span class="sop-file-ext">' + fileExtBadge(f.name) + '</span>' +
        '<span class="sop-file-name">' + f.name + '</span>' +
        '<span class="sop-file-size">' + formatFileSize(f.size) + '</span>' +
        '<button type="button" class="sop-file-remove" data-i="' + i + '" title="Remove">\u2715</button>' +
      '</div>';
    }).join('');
    document.querySelectorAll('#trainPendingFiles .sop-file-remove').forEach(function (btn) {
      btn.onclick = function () {
        pendingFiles.splice(parseInt(btn.getAttribute('data-i'), 10), 1);
        drawPendingFiles();
      };
    });
  }

  document.getElementById('trainFileInput').onchange = function (e) {
    pendingFiles = pendingFiles.concat(Array.prototype.slice.call(e.target.files));
    drawPendingFiles();
    e.target.value = '';
  };

  function drawManageList() {
    document.getElementById('trainManageList').innerHTML = TRAINING_MODULES.map(function (m, i) {
      var metaLine = m.launchFile ?
        m.category + ' \u00b7 external link (' + m.launchFile + ')' :
        m.category + ' \u00b7 ' + (m.files ? m.files.length : 0) + ' file(s)';
      return '<div class="sop-row">' +
        '<div class="sop-row-icon">' + navIcon('training') + '</div>' +
        '<div class="sop-row-body">' +
          '<div class="sop-row-title">' + m.title + '</div>' +
          '<div class="sop-row-meta">' + metaLine + '</div>' +
          (m.files && m.files.length ? sopFilesHtml(m) : '') +
        '</div>' +
        '<button type="button" class="sop-row-delete" data-i="' + i + '" title="Remove module">\u2715</button>' +
      '</div>';
    }).join('');

    document.querySelectorAll('#trainManageList .sop-row-delete').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        TRAINING_MODULES.splice(parseInt(btn.getAttribute('data-i'), 10), 1);
        drawManageList();
      };
    });
  }
  drawManageList();

  document.getElementById('addTrainingBtn').onclick = function () {
    var category = document.getElementById('trainNewCat').value.trim();
    var title = document.getElementById('trainNewTitle').value.trim();
    var desc = document.getElementById('trainNewDesc').value.trim();
    if (!category || !title) return;

    var uploaded = pendingFiles.map(function (f) {
      return { name: f.name, url: URL.createObjectURL(f), size: f.size, type: f.type };
    });

    TRAINING_MODULES.unshift({
      category: category,
      title: title,
      desc: desc || 'No description provided yet.',
      steps: 4,
      files: uploaded
    });

    document.getElementById('trainNewCat').value = '';
    document.getElementById('trainNewTitle').value = '';
    document.getElementById('trainNewDesc').value = '';
    pendingFiles = [];
    drawPendingFiles();
    drawManageList();
    addLiveNotification('New training module added: <b>' + title + '</b>');

    var successBox = document.getElementById('addTrainingSuccess');
    document.getElementById('addTrainingSuccessText').textContent = 'Published "' + title + '" to Training.';
    successBox.classList.add('show');
    setTimeout(function () { successBox.classList.remove('show'); }, 3000);
  };
}
</script>
</body>
</html>
